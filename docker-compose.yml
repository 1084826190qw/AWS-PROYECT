services:

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php
      - node

    restart: always


  php:
    build: ./php
    container_name: php

    volumes:
      - ./php:/var/www/html

    restart: always


  mysql:
    image: mysql:8
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: tienda

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always


  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_PASSWORD: postgres123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always


  node:
    build: ./node
    container_name: node

    restart: always


volumes:
  mysql_data:
  postgres_data:
